# Matriz de cobertura — Cap. I · versão q6/v7 (Unidade 6: banco fechado; FATEC 2015 corrigida · Unidade 5: banco fechado · Unidade 4: +4-O3, banco fechado · Unidade 3: +3-O3, banco fechado · Unidade 1 recalibrada: +1-O3, +1-O4 · Unidade 2: +2-O4, banco fechado)
# IDs: <unidade>-<tipo><n>  ·  H = construção/resultado de "De onde vem"
#      U = contexto de uso (gatilho) · E = erro comum · O = observação
# Regras (w3): todo ID coberto por ≥1 exemplo; todo U e E coberto por ≥1 questão;
#              cada unidade com exemplo N1, N2 e N3. Falhou → revisão manual.
#        R6 (q4/D2): ≥ questoes_meta.integradoras questões com integradora: true (exemplo integrador não conta).
# fonte: autoral | historico | FME | OBMEP | vestibular | concurso  (+ status de verificação)

unidades:
- n: 1
  titulo: Proposição e negação
  ids:
    H1: as três características da proposição (frase declarativa + princípios de não contradição e terceiro excluído)
    H2: negação como operação que inverte o valor; tabela de ~p
    U1: decidir se uma frase é proposição
    U2: negar relações (=, <, ∈, |)
    U3: problemas de veracidade (quem mente / quem diz a verdade)
    E1: achar que proposição falsa não é proposição
    E2: negar ">" com "<" (esquecer a igualdade)
    E3: negar com o contrário em vez do contraditório
    E4: tratar sentença aberta como proposição
    O1: paradoxo do mentiroso (Eubulides)
    O2: bivalência como escolha — batalha naval, 'é dia', Brouwer, Łukasiewicz
    O3: 'concordância negativa: o português não é lógica'
    O4: o Monte (sorites) e as palavras vagas
    O5: a negação nos computadores (NOT, !!x)
  exemplos:
