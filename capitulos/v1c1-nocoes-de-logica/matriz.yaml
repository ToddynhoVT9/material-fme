- n: 4
  titulo: Tautologia, contradição, implicação e equivalência
  ids:
    H1: tautologia, contradição e contingência pela tabela
    H2: p ⇒ q quando p → q é tautologia
    H3: p ⇔ q quando p ↔ q é tautologia
    H4: leis da álgebra de Boole (ex. 7 do FME)
    U1: classificar ou verificar por tabela completa (tautologia? equivalência?)
    U2: reconhecer "é equivalente a" (contrapositiva, ~p ∨ q)
    U3: teorema, recíproco e equivalência
    U4: simplificar expressões
    U5: validar argumentos
    E1: confundir → com ⇒
    E2: esquecer a contingência
    E3: julgar a equivalência pela semelhança das frases
    E4: ordem das linhas / casos perdidos
    O1: a tautologia "não diz nada" (Wittgenstein, 4.46)
    O2: quem inventou a tabela-verdade (Peirce, Wittgenstein, Post)
    O3: 'a explosão das tabelas: 2^n linhas e o problema SAT (Cook, 1971)'
    O4: uma só operação basta (Sheffer 1913, Nicod 1917)
