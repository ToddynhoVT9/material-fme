- n: 6
  titulo: Negação de proposições
  ids:
    H1: leis de De Morgan pela tabela
    H2: ~(p → q) ⇔ p ∧ ~q
    H3: negação de quantificadores como De Morgan generalizado
    H4: quadrado das oposições (contraditórias x contrárias)
    U1: negar compostas
    U2: negar quantificadas
    U3: negar condicional
    U4: contraexemplo e redução ao absurdo
    U5: código e buscas
    E1: negar "todo" com "nenhum"
    E2: manter o conectivo ao negar (negar ∧ mantendo ∧, ou ∨ mantendo ∨)
    E3: negar p → q como ~p → ~q ou p → ~q
    E4: '"alguns são" → "alguns não são"'
    E5: desigualdade sem trocar estrita/não estrita
    O1: negação do ↔ (lacuna do FME)
    O2: '"quebre a barra, troque o sinal"'
