    U3: '"apenas uma é verdadeira" (disjunção exclusiva)'
    U4: circuitos e código (série/paralelo, &&/||)
    U5: ponte com conjuntos (∩, ∪)
    E1: ler o "ou" como exclusivo
    E2: exigir relação de sentido entre as partes
    E3: não reconhecer "mas", "nem", "porém"
    E4: tabela com linhas faltando
    O1: Crisipo x Hiparco — contar conjunções
